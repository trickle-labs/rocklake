[workspace]
members = [
    "crates/rocklake-core",
    "crates/rocklake-catalog",
    "crates/rocklake-sql",
    "crates/rocklake-pgwire",
    "crates/rocklake-router",
    "crates/rocklake-ffi",
    "crates/rocklake-client",
    "crates/rocklake-datafusion",
    "crates/rocklake-testkit",
    "tools/rocklake-evidence",
]
exclude = ["vendor/figment"]
resolver = "2"

[workspace.package]
version = "0.64.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/trickle-labs/rocklake"

[workspace.dependencies]
# Storage
slatedb = { version = "0.13", default-features = false, features = ["aws", "moka"] }
object_store = { version = "0.12" }
bytes = "1"

# Encryption
aes-gcm = "0.10"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "signal", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
prost-types = "0.13"
base64 = "0.22"

# SQL parsing
sqlparser = { version = "0.55", features = ["visitor"] }

# PG wire protocol
pgwire = "0.28"

# Testing
proptest = "1"
tempfile = "3"
criterion = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
tokio-postgres = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }

# DataFusion
datafusion = { version = "=55.1.0", git = "https://github.com/apache/datafusion.git", rev = "8f77b417a9b4fe0f143f50519db499b9de3f7a97" }

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
toml = "0.8"
sha2 = "0.11"
libc = "0.2"

[patch.crates-io]
# Keep SlateDB YAML configuration working until Figment uses a maintained parser.
figment = { path = "vendor/figment" }

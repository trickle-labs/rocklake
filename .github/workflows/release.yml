name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Verify that the tagged commit already contains the release version.
  prepare:
    name: Verify Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Extract version from tag
        id: version
        run: |
          RAW="${GITHUB_REF#refs/tags/v}"
          echo "version=${RAW}" >> "$GITHUB_OUTPUT"

      - name: Verify workspace version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CURRENT=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "ERROR: tag version ${VERSION} does not match Cargo.toml version ${CURRENT}" >&2
            exit 1
          fi
          echo "Workspace version ${CURRENT} matches tag v${VERSION}"

  certification:
    name: Release Certification
    needs: prepare
    uses: ./.github/workflows/release-certification.yml
    with:
      certified-ref: ${{ github.sha }}
    permissions:
      contents: read

  # Build release binaries for each target platform.
  build:
    name: Build (${{ matrix.target }})
    needs: [certification, prepare]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: rocklake-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: rocklake-linux-aarch64
            cross: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: rocklake-macos-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: rocklake-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Verify certified tagged SHA
        run: test "$(git rev-parse HEAD)" = "${{ needs.certification.outputs.certified-sha }}"

      - name: Install cross (for aarch64 Linux)
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build release binary (native, Unix)
        if: matrix.cross != true && runner.os != 'Windows'
        run: |
          cargo build -p rocklake-pgwire --bin rocklake --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/rocklake ${{ matrix.artifact }}

      - name: Build release binary (native, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p rocklake-pgwire --bin rocklake --release --target ${{ matrix.target }}
          Copy-Item "target/${{ matrix.target }}/release/rocklake.exe" "${{ matrix.artifact }}"

      - name: Build release binary (cross)
        if: matrix.cross == true
        run: |
          cross build -p rocklake-pgwire --bin rocklake --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/rocklake ${{ matrix.artifact }}

      - name: Generate checksum (Unix)
        if: runner.os != 'Windows'
        run: sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}" | Out-File -Encoding ascii "${{ matrix.artifact }}.sha256"

      - name: Write build metadata
        shell: bash
        run: |
          printf '{"version":"%s","tag":"%s","certified_sha":"%s","target":"%s","rustc":"%s"}\n' \
            "${{ needs.prepare.outputs.version }}" "${GITHUB_REF_NAME}" \
            "${{ needs.certification.outputs.certified-sha }}" "${{ matrix.target }}" "$(rustc -V)" \
            > "${{ matrix.artifact }}.build-metadata.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
            ${{ matrix.artifact }}.build-metadata.json

  sbom:
    name: SBOM
    needs: [certification, prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.certification.outputs.certified-sha }}
      - name: Verify certified tagged SHA
        run: test "$(git rev-parse HEAD)" = "${{ needs.certification.outputs.certified-sha }}"
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: rocklake-v${{ needs.prepare.outputs.version }}.sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: rocklake-v${{ needs.prepare.outputs.version }}.sbom.spdx.json

  # Create a GitHub Release with all binaries and checksums.
  release:
    name: GitHub Release
    needs: [build, sbom, prepare, certification]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Verify release SHA and checksums
        run: |
          test "${GITHUB_SHA}" = "${{ needs.certification.outputs.certified-sha }}"
          test -f artifacts/rocklake-v${{ needs.prepare.outputs.version }}.sbom.spdx.json
          cd artifacts
          for checksum in *.sha256; do sha256sum -c "$checksum" --status; done

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/rocklake-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RockLake v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          files: |
            artifacts/rocklake-*
          generate_release_notes: true
          body: |
            ## RockLake v${{ needs.prepare.outputs.version }}

            ### Installation

            Download the binary for your platform, verify the checksum, and make it executable:

            **Linux x86-64**
            ```bash
            curl -LO https://github.com/trickle-labs/rocklake/releases/download/v${{ needs.prepare.outputs.version }}/rocklake-linux-x86_64
            sha256sum -c rocklake-linux-x86_64.sha256
            chmod +x rocklake-linux-x86_64
            mv rocklake-linux-x86_64 /usr/local/bin/rocklake
            ```

            **macOS arm64 (Apple Silicon)**
            ```bash
            curl -LO https://github.com/trickle-labs/rocklake/releases/download/v${{ needs.prepare.outputs.version }}/rocklake-macos-arm64
            shasum -a 256 -c rocklake-macos-arm64.sha256
            chmod +x rocklake-macos-arm64
            mv rocklake-macos-arm64 /usr/local/bin/rocklake
            ```

            **Windows x86-64** (PowerShell)
            ```powershell
            Invoke-WebRequest -Uri "https://github.com/trickle-labs/rocklake/releases/download/v${{ needs.prepare.outputs.version }}/rocklake-windows-x86_64.exe" -OutFile rocklake.exe
            # Verify checksum
            $expected = (Get-Content rocklake-windows-x86_64.exe.sha256).Split()[0]
            $actual   = (Get-FileHash rocklake.exe -Algorithm SHA256).Hash.ToLower()
            if ($expected -ne $actual) { Write-Error "Checksum mismatch" } else { Write-Output "Checksum OK" }
            # Move to a directory on your PATH
            Move-Item rocklake.exe "$env:USERPROFILE\.local\bin\rocklake.exe"
            ```

            See [CHANGELOG.md](https://github.com/trickle-labs/rocklake/blob/main/CHANGELOG.md) for full release notes.

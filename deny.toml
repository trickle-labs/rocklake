# cargo-deny configuration for RockLake
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Target triples to check.  Ubuntu x86-64 and macOS arm64 cover CI.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

# ─── Advisories ───────────────────────────────────────────────────────────────
[advisories]
# Deny any crates with known security vulnerabilities.
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# These advisories are from transitive dependencies we cannot directly control.
# They are tracked; we will update when upstream provides a fix.
ignore = [
    # ID: RUSTSEC-2025-0141; dependency: bincode (transitive)
    # reason: upstream migration is not yet available; mitigation: no direct
    # bincode API is used by RockLake; upstream: bincode release tracker;
    # review/expiry: 2026-12-31
    { id = "RUSTSEC-2025-0141", reason = "Transitive bincode dependency. Revisit when upstream migrates to bincode 2.x." },
    # ID: RUSTSEC-2024-0436; dependency: paste (transitive)
    # reason: affected upstream crates have not removed it; mitigation: no
    # RockLake code depends on paste directly; upstream: paste dependents'
    # release trackers; review/expiry: 2026-12-31
    { id = "RUSTSEC-2024-0436", reason = "Transitive paste dependency. Revisit when affected upstream crates remove it." },
    # ID: RUSTSEC-2025-0134; dependency: rustls-pemfile (transitive)
    # reason: current tokio-rustls compatibility still selects this API;
    # mitigation: TLS parsing is isolated to startup; upstream: tokio-rustls
    # release tracker; review/expiry: 2026-12-31
    { id = "RUSTSEC-2025-0134", reason = "Transitive rustls-pemfile dependency from tokio-rustls 0.26. Revisit on the next compatible upgrade." },
    # ID: RUSTSEC-2026-0194; dependency: quick-xml (transitive)
    # reason: object_store 0.12.x has not upgraded; mitigation: RockLake does
    # not parse untrusted XML directly; upstream: object_store release tracker;
    # review/expiry: 2026-12-31
    { id = "RUSTSEC-2026-0194", reason = "Transitive quick-xml dependency from object_store 0.12.x. Revisit when object_store upgrades quick-xml to at least 0.41.0." },
    # ID: RUSTSEC-2026-0195; dependency: quick-xml (transitive)
    # reason: object_store 0.12.x has not upgraded; mitigation: RockLake does
    # not parse untrusted XML directly; upstream: object_store release tracker;
    # review/expiry: 2026-12-31
    { id = "RUSTSEC-2026-0195", reason = "Transitive quick-xml dependency from object_store 0.12.x. Revisit when object_store upgrades quick-xml to at least 0.41.0." },
]

# ─── Licenses ─────────────────────────────────────────────────────────────────
# v0.21: License enforcement enabled.  Allow list covers all licenses found in
# the dependency tree as of v0.21.  Crates outside this list require an explicit
# exception with rationale.
[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "ISC",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
# Exceptions: crates whose licenses are outside the allow list but vetted.
[[licenses.exceptions]]
# ring uses a custom OpenSSL-compatible license; acceptable for crypto.
allow = ["LicenseRef-ring"]
crate = "ring"
[[licenses.exceptions]]
# webpki uses ISC + custom; acceptable for TLS certificate parsing.
allow = ["LicenseRef-webpki"]
crate = "webpki"
[[licenses.exceptions]]
# fxhash uses Apache-2.0/MIT with no issues (unlicense-compatible).
allow = ["MIT", "Apache-2.0"]
crate = "fxhash"

# ─── Bans ─────────────────────────────────────────────────────────────────────
[bans]
# Warn (not deny) on duplicate versions of the same crate (common in large dep trees).
multiple-versions = "warn"
# Warn on wildcard dependencies (path-only workspace deps have implicit "*" version).
wildcards = "warn"

# ─── Sources ──────────────────────────────────────────────────────────────────
[sources]
# Only allow crates from crates.io and local paths.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
